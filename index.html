function totalG(){var t=0;for(var i=0;i<LOG.length;i++)if(LOG[i].ev==="at")t+=parseInt(LOG[i].g)||0;
 return t+(parseInt(HAMARI)||0)}
function stats(){var s={at:0,cz:0,czS:0,senmetsu:0,joui:0,mai:0};
 for(var i=0;i<LOG.length;i++){var e=LOG[i];
  if(e.ev==="at")s.at++;
  if(e.ev==="cz"){s.cz++;if(e.res==="s")s.czS++;if(e.type==="senmetsu")s.senmetsu++}
  if(e.ev==="joui")s.joui++;
  if(e.mai)s.mai+=parseInt(e.mai)||0}
 return s}

/* ============================================================ ベイズ推定 ============================================================ */
function estimate(){
 var ll={},i,s,reasons=[],conf=[],used=false,mask={};
 for(i=0;i<SETS.length;i++){ll[SETS[i]]=0;mask[SETS[i]]=true}
 function bino(succ,trials,rates,label){if(!trials)return;used=true;
  for(i=0;i<SETS.length;i++){s=SETS[i];var p=Math.min(.999,Math.max(.0005,rates[s]));ll[s]+=succ*Math.log(p)+(trials-succ)*Math.log(1-p);}
  reasons.push(label+" "+succ+"/"+trials);}
 var tG=totalG(),st=stats();
 // AT初当たり
 if(tG>=1000&&st.at>0){used=true;
  for(i=0;i<SETS.length;i++){s=SETS[i];var p=1/ATX[s];ll[s]+=st.at*Math.log(p)+(tG-st.at)*Math.log(1-p);}
  reasons.push("AT初当たり 1/"+Math.round(tG/st.at));}
 // 規定Gゾーン当選率（AT記録のG数から自動判定。CZ経由等でゾーン内当選した回は打ち切り扱いで除外）
 ZONE.forEach(function(z){var tr=0,hk=0;
  for(var j=0;j<LOG.length;j++){var e=LOG[j];if(e.ev!=="at")continue;var g=parseInt(e.g)||0;
   if(g<z.lo)continue;
   if(g<=z.hi){if(e.kik==="g"){tr++;hk++}}
   else tr++;}
  if(tr>=2)bino(hk,tr,z.r,z.l);});
 // CZ：AT当選分と重複しない「AT非当選に終わったCZ」のみを独立証拠として使う
 var czFail=st.cz-st.czS;
 if(tG>=1000&&czFail>0){used=true;
  var fr=Math.min(.95,Math.max(.05,czFail/st.cz));
  for(i=0;i<SETS.length;i++){s=SETS[i];var q=fr/CZX[s];ll[s]+=czFail*Math.log(q)+(tG-czFail)*Math.log(1-q);}
  reasons.push("CZ失敗 "+czFail+"/"+st.cz+"（AT分と非重複）");}
 // 強チェリー直撃（分母あり＝正規の二項）
 if(CC.kyoT>0)bino(Math.min(CC.kyoH,CC.kyoT),CC.kyoT,CHOKU,"強チェ直撃");
 // 弱チェ/スイカ→CZ：外した回数まで入っている時だけ正規の二項、そうでなければ減衰した出現比
 if(CC.wT>CC.wCZ)bino(CC.wCZ,CC.wT,WEAK,"弱チェ/スイカ→CZ");
 else if(CC.wCZ>0){used=true;
  for(i=0;i<SETS.length;i++){s=SETS[i];ll[s]+=0.5*CC.wCZ*Math.log(WEAKR[s]);}
  reasons.push("弱チェ/スイカ→CZ "+CC.wCZ+"回（母数不足・減衰）");}
 // 示唆演出（ハード制約 / 準確定の重み / 推定重み）
 SIG.forEach(function(it){var n=CC[it.k];if(!n)return;
  if(it.m){var mm={};it.m.forEach(function(x){mm[x]=1});
   for(i=0;i<SETS.length;i++)if(!mm[SETS[i]])mask[SETS[i]]=false;
   conf.push(it.l+"→"+it.h);used=true;}
  else if(it.q){used=true;
   for(i=0;i<SETS.length;i++){s=SETS[i];if(s<it.q)ll[s]+=n*Math.log(QPEN);}
   conf.push(it.l+"→"+it.h);}
  else if(it.soft&&USE_SOFT){used=true;
   for(i=0;i<SETS.length;i++){s=SETS[i];ll[s]+=n*Math.log(SOFT[it.soft][s]);}}});
 // 正規化：デフォルト（示唆なし）が出たことも「高設定ではない証拠」として引く
 if(USE_SOFT)SOFTG.forEach(function(g){
  var arr=(g.items==="end")?ENDSCR:VOICE,nObs=0;
  arr.forEach(function(it){if(g.base[it.k])nObs+=CC[it.k]});
  if(!nObs)return;
  for(i=0;i<SETS.length;i++){s=SETS[i];var Z=0;
   arr.forEach(function(it){var b=g.base[it.k];if(b)Z+=b*(it.soft?SOFT[it.soft][s]:1)});
   ll[s]-=nObs*Math.log(Z);}});
 // 入力の整合性チェック
 var warn=[];
 if(CC.kyoH>CC.kyoT)warn.push("強チェ直撃 "+CC.kyoH+"回 > 強チェ "+CC.kyoT+"回");
 if(CC.wT>0&&CC.wCZ>CC.wT)warn.push("弱チェ/スイカCZ "+CC.wCZ+"回 > 母数 "+CC.wT+"回");
 var noG=0;for(i=0;i<LOG.length;i++)if(LOG[i].ev==="at"&&!(parseInt(LOG[i].g)>0))noG++;
 if(noG)warn.push("G数未入力のAT記録 "+noG+"件（初当たりが過大評価されます）");
 var softN=0;SIG.forEach(function(it){if(it.soft)softN+=CC[it.k]});
 if(softN&&USE_SOFT)reasons.push("示唆演出 "+softN+"回");
 // softmax + マスク
 var any=false;for(i=0;i<SETS.length;i++)if(mask[SETS[i]])any=true;
 if(!any)for(i=0;i<SETS.length;i++)mask[SETS[i]]=true; // 矛盾時は制約を解除
 var mx=-Infinity;for(i=0;i<SETS.length;i++)if(mask[SETS[i]]&&ll[SETS[i]]>mx)mx=ll[SETS[i]];
 var ex={},z=0;for(i=0;i<SETS.length;i++){s=SETS[i];var v=mask[s]?Math.exp(ll[s]-mx):0;ex[s]=v;z+=v;}
 var post={};for(i=0;i<SETS.length;i++){s=SETS[i];post[s]=z?ex[s]/z:0}
 var best=SETS[0],bp=-1,esum=0,odd=0,even=0,hi=0;
 for(i=0;i<SETS.length;i++){s=SETS[i];if(post[s]>bp){bp=post[s];best=s}esum+=s*post[s];
  if(s%2)odd+=post[s];else even+=post[s];if(s>=4)hi+=post[s];}
 return {post:post,best:best,bestP:bp,exp:esum,odd:odd,even:even,hi:hi,used:used,reasons:reasons,conf:conf,mask:mask,any:any,warn:warn};}

function buildNote(e){var b=[],f;
 if(e.kik){f=AT_KIK.concat(CZ_KIK).filter(function(x){return x.id===e.kik})[0];if(f)b.push(f.l)}

 if(e.res){f=CZ_RES.concat(KYO_RES,WEAK_RES).filter(function(x){return x.id===e.res})[0];if(f)b.push(f.l)}
 if(e.scr&&e.scr!=="none")b.push("画面:"+sigLabel(e.scr));
 if(e.voice&&e.voice!=="none")b.push("ボイス:"+sigLabel(e.voice));

 return b.join("　")}

 for(var j=0;j<LOG.length;j++){var e=LOG[j],ev=EVMAP[e.ev];
  var gF=(e.ev==="at"&&e.g)?e.g+"G":"-";
  t+=gF+"　"+(ev?ev.l:e.ev)+"　"+buildNote(e).replace(/<[^>]+>/g,"")+"\n";}
 ct.innerHTML='<div class="exp"><div class="exp-h">長押し→すべて選択→コピー</div><textarea class="exp-ta" id="eTA" readonly>'+t.replace(/</g,"&lt;")+'</textarea></div>';
 var ta=document.getElementById("eTA");if(ta){ta.focus();ta.setSelectionRange(0,ta.value.length)}}

/* ===== アクション ===== */
function addEntry(){if(!canAdd())return;var e={ev:curEv,ck:[]},ev=EVMAP[curEv];
 function bump(k){if(k in CC){CC[k]++;e.ck.push(k)}}
 if(ev.cat==="at"){e.kik=curKik;e.g=curG||"0";HAMARI="";}
 if(ev.cat==="cz"){e.type=curType;e.kik=curKik;e.res=curRes;}
 if(ev.cat==="atend"){
  if(curConf){e.conf=curConf;if(curConf!=="none")bump(curConf)}
  if(curMai)e.mai=curMai;}
 if(ev.cat==="joui")e.type=curType;
 if(ev.cat==="enshutsu"){e.encat=curCat;e.enopt=curOpt;
  if(curCat==="timer"&&curOpt==="t6")bump("timer6");}
 if(curNote)e.note=curNote;
 LOG.push(e);
 curEv=null;curG="";curKik=null;curType=null;curRes=null;curScr=null;curVoice=null;curConf=null;curMai="";curNote="";curCat=null;curOpt=null;
 save();render()}

function doRst(){if(!rstP){rstP=true;if(rstT)clearTimeout(rstT);rstT=setTimeout(function(){rstP=false;render()},3000);render();return}
 LOG=[];initC();HAMARI="";save();rstP=false;render()}

document.getElementById("W").addEventListener("click",function(ev){var el=ev.target;
 for(var i=0;i<6&&el&&el!==this;i++){if(el.dataset){
  if(el.dataset.tab){TAB=el.dataset.tab;render();return}
  if(el.dataset.ev){curEv=(curEv===el.dataset.ev?null:el.dataset.ev);
   curKik=null;curType=null;curRes=null;curScr=null;curVoice=null;curConf=null;curMai="";curCat=null;curOpt=null;
   curG=(curEv==="at"?(HAMARI||""):"");render();return}
  if(el.dataset.kik!==undefined){curKik=(curKik===el.dataset.kik?null:el.dataset.kik);render();return}
  if(el.dataset.type!==undefined){curType=(curType===el.dataset.type?null:el.dataset.type);render();return}
  if(el.dataset.res!==undefined){curRes=(curRes===el.dataset.res?null:el.dataset.res);render();return}
  if(el.dataset.scr!==undefined){curScr=(curScr===el.dataset.scr?null:el.dataset.scr);render();return}
  if(el.dataset.voice!==undefined){curVoice=(curVoice===el.dataset.voice?null:el.dataset.voice);render();return}
  if(el.dataset.conf!==undefined){curConf=(curConf===el.dataset.conf?null:el.dataset.conf);render();return}
  if(el.dataset.encat!==undefined){curCat=(curCat===el.dataset.encat?null:el.dataset.encat);curOpt=null;render();return}
  if(el.dataset.enopt!==undefined){curOpt=(curOpt===el.dataset.enopt?null:el.dataset.enopt);render();return}
  if(el.dataset.a==="add"){addEntry();return}
  if(el.dataset.del!==undefined){var rm=LOG.splice(parseInt(el.dataset.del),1)[0];
   if(rm&&rm.ck)rm.ck.forEach(function(k){if(CC[k]>0)CC[k]--});save();render();return}
  if(el.dataset.tgl){USE_SOFT=!USE_SOFT;save();render();return}
  if(el.dataset.tog){COL[el.dataset.tog]=!COL[el.dataset.tog];render();return}
  if(el.dataset.itog){infoCol[el.dataset.itog]=!infoCol[el.dataset.itog];render();return}
  if(el.dataset.ci){CC[el.dataset.ci]++;save();render();return}
  if(el.dataset.cd){if(CC[el.dataset.cd]>0)CC[el.dataset.cd]--;save();render();return}
 }el=el.parentElement}});
document.getElementById("W").addEventListener("input",function(ev){
 if(ev.target.id==="iH"){HAMARI=ev.target.value;save();rEst();rQS();
  var g=document.querySelector(".gtot b");if(g)g.textContent=totalG();return}
 if(ev.target.id==="iG")curG=ev.target.value;
 if(ev.target.id==="iN")curNote=ev.target.value;
 if(ev.target.id==="iMai")curMai=ev.target.value});

load();render();
</script>
